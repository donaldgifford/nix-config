# ~/.config/starship.toml
"$schema" = 'https://starship.rs/config-schema.json'

format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$bun\
$rust\
$golang\
$php\
$fill\
$line_break\
$shell\
$character"""

right_format = """
$mise\
$kubernetes\
$aws\
$time\
"""

palette = 'tokyonight_dark'

[fill]
symbol = " "

[directory]
style = "cyan"
format = "[$path]($style)"
truncation_length = 0
truncate_to_repo = false

[directory.substitutions]
"Documents" = "docs"
"Downloads" = "dl"
"code" = "c"

[git_branch]
symbol = ""
format = ' [\($branch\)]( red)'

[git_status]
format = '( $modified$deleted)'
modified = '[+$count](green)'
deleted = '[ -$count](dimmed red)'
staged = ''
untracked = ''
conflicted = ''
ahead = ''
behind = ''
renamed = ''
stashed = ''
typechanged = ''

[nodejs]
symbol = "node"
format = '[$symbol $version](dimmed)'

[bun]
symbol = "bun"
format = '[$symbol $version](dimmed)'
detect_folders = ["frontend", "ui"]

[rust]
symbol = "rust"
format = ' [$symbol $version](dimmed)'

[golang]
symbol = "go"
format = ' [$symbol $version](dimmed)'

[php]
symbol = "php"
format = ' [$symbol $version](dimmed)'

[time]
disabled = false
time_format = "%H:%M"
style = "yellow"
format = ' [$time]($style)'

[character]
success_symbol = "[❯](purple bold)"
error_symbol = "[❯](red)"

[aws]
format = '[$symbol$profile]($style) '
style = "bold blue"
symbol = "aws:"
[aws.profile_aliases]
Enterprise_Naming_Scheme-voidstars = "void**"

[kubernetes]
format = '[$symbol$context( \($namespace\))]( dimmed)'
disabled = false

[[kubernetes.contexts]]
context_pattern = "k3s"
style = "bold red"
symbol = "k3s:"
context_alias = "k3s"

[[kubernetes.contexts]]
context_pattern = "k3d_.*_(?P<cluster>[\\w-]+)"
context_alias = "k3d-$cluster"
style = "green"

[mise]
disabled = false
healthy_symbol = "ready"

[container]
disabled = true

[shell]
disabled = false
zsh_indicator = ""
nu_indicator = "nu "
format = "[$indicator]($style)"
style = "green bold"


# Warm Burnout Dark: Starship palette
# Paste this into your ~/.config/starship.toml
# Then set: palette = 'warm_burnout_dark'

[palettes.warm_burnout_dark]
background = "#1a1510"
foreground = "#bfbdb6"
comment = "#b4a89c"
cursor = "#f5c56e"
accent = "#b8522e"
burnt_orange = "#ff8f40"
amber = "#ffb454"
gold = "#e6c08a"
aged_brass = "#deb074"
terra_cotta = "#dc9e92"
coral = "#ec9878"
dusty_mauve = "#d4a8b8"
dried_sage = "#b4bc78"
verdigris = "#96b898"
steel_patina = "#90aec0"
error = "#f49090"
red = "#f06b73"
green = "#70bf56"
yellow = "#fdb04c"
blue = "#4fbfff"
magenta = "#d0a1ff"
purple = "#d0a1ff" # starship styles use `purple`, not `magenta`
cyan = "#93e2c8"

# Tokyonight Night palette — counterpart for the theme switcher; values match
# the ghostty "Tokyonight Night" ANSI colors this config used to inherit.
[palettes.tokyonight_dark]
background = "#1a1b26"
foreground = "#c0caf5"
comment = "#565f89"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
purple = "#bb9af7"
cyan = "#7dcfff"
