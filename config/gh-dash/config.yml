---
prSections:
  - title: My Pull Requests
    filters: is:open author:@me
  - title: Needs My Review
    filters: is:open review-requested:@me
  - title: Involved
    filters: is:open involves:@me -author:@me
issuesSections:
  - title: My Issues
    filters: is:open author:@me
  - title: Assigned
    filters: is:open assignee:@me
  - title: Involved
    filters: is:open involves:@me -author:@me
defaults:
  preview:
    open: true
    width: 100
  prsLimit: 20
  issuesLimit: 20
  view: prs
  layout:
    prs:
      updatedAt:
        width: 7
      repo:
        width: 15
      author:
        width: 15
      assignees:
        width: 20
        hidden: true
      base:
        width: 15
        hidden: true
      lines:
        width: 16
    issues:
      updatedAt:
        width: 7
      repo:
        width: 15
      creator:
        width: 10
      assignees:
        width: 20
        hidden: true
  refetchIntervalMinutes: 30
keybindings:
  universal:
    - key: g
      name: lazygit
      command: >
        cd {{.RepoPath}} && lazygit
  issues:
    # direct exec (no tmux) — works inside herdr and tmux alike;
    # gh-dash suspends fullscreen and returns when the command exits
    - key: B
      command: >
        cd {{.RepoPath}} && ghprb {{.IssueNumber}}
    - key: e
      command: >
        cd {{.RepoPath}} && nvim -c ":silent Octo issue edit {{.IssueNumber}}"
    - key: i
      command: >
        cd {{.RepoPath}} && nvim -c ":silent Octo issue create"
  prs:
    - key: O
      command: >
        cd {{.RepoPath}} && nvim -c ":silent Octo pr edit {{.PrNumber}}"
    # full hunk review UI (menu bar) — pager mode (d) is minimal by design,
    # so D routes through a temp file to get a real review session
    - key: D
      name: hunk review
      command: >
        gh pr diff --repo {{.RepoName}} {{.PrNumber}} > /tmp/gh-dash-pr-{{.PrNumber}}.patch
        && hunk patch /tmp/gh-dash-pr-{{.PrNumber}}.patch --theme auto
    - key: v
      name: approve
      command: >
        gh pr review --repo {{.RepoName}} --approve --body "$(gum input --prompt='Approval Comment: ')" {{.PrNumber}}
    - key: T
      command: gh enhance -R {{.RepoName}} {{.PrNumber}}
  notifications:
    - key: d
      builtin: markAsDone
    - key: D
      builtin: markAllAsDone
repoPaths:
  donaldgifford/*: ~/code/*
  donaldgifford/dotfiles: ~/code/dotfiles
  donaldgifford/nix-config: ~/code/nix-config
theme:
  ui:
    table:
      showSeparator: true
      compact: false
pager:
  diff: diffnav
