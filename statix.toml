# statix config (`just lint`). Lint ids: `statix list`.
# W20 repeated_keys: hosts/workstation/configuration.nix groups by concern
# (boot…, services…, hardware…) rather than by attribute, which is the
# readable layout for a host file; keep the lint off instead of restructuring.
disabled = ["repeated_keys"]
nix_version = "2.4"
ignore = ["backup", "hosts/workstation/hardware-configuration.nix"]
